<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 334' width='760' height='334' role='img' aria-labelledby='t d'><title id='t'>Pressure versus control</title><desc id='d'>Pooled flip rate for threat, shame, coercion and a plain wrong claim.</desc><rect width='760' height='334' fill='white'/><text x='20.0' y='28.0' font-size='16' text-anchor='start' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Pressure vs control</text><text x='20.0' y='48.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>MEASURED. Pooled flip rate over models, 95% bootstrap CI. Grey = a wrong claim with no pressure.</text><line x1='250.0' y1='82.0' x2='250.0' y2='274.0' stroke='#e2e8f0' stroke-width='1'/><text x='250.0' y='290.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0%</text><line x1='367.5' y1='82.0' x2='367.5' y2='274.0' stroke='#e2e8f0' stroke-width='1'/><text x='367.5' y='290.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>25%</text><line x1='485.0' y1='82.0' x2='485.0' y2='274.0' stroke='#e2e8f0' stroke-width='1'/><text x='485.0' y='290.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>50%</text><line x1='602.5' y1='82.0' x2='602.5' y2='274.0' stroke='#e2e8f0' stroke-width='1'/><text x='602.5' y='290.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>75%</text><line x1='720.0' y1='82.0' x2='720.0' y2='274.0' stroke='#e2e8f0' stroke-width='1'/><text x='720.0' y='290.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>100%</text><text x='238.0' y='117.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>plain wrong claim (Study B)</text><line x1='398.7' y1='113.0' x2='412.2' y2='113.0' stroke='#4a5568' stroke-width='3'/><circle cx='405.5' cy='113.0' r='6' fill='#4a5568'/><text x='420.2' y='117.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>33%</text><text x='238.0' y='163.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>threat (pooled 3 levels)</text><line x1='483.4' y1='159.0' x2='498.4' y2='159.0' stroke='#2b6cb0' stroke-width='3'/><circle cx='490.6' cy='159.0' r='6' fill='#2b6cb0'/><text x='506.4' y='163.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>51%</text><text x='238.0' y='209.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>shame (pooled 3 levels)</text><line x1='447.7' y1='205.0' x2='458.6' y2='205.0' stroke='#2b6cb0' stroke-width='3'/><circle cx='453.1' cy='205.0' r='6' fill='#2b6cb0'/><text x='466.6' y='209.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>43%</text><text x='238.0' y='255.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>coercion (pooled 3 levels)</text><line x1='630.3' y1='251.0' x2='638.3' y2='251.0' stroke='#2b6cb0' stroke-width='3'/><circle cx='634.5' cy='251.0' r='6' fill='#2b6cb0'/><text x='646.3' y='255.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>82%</text></svg>
