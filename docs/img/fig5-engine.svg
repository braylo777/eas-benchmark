<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 440' width='760' height='440' role='img' aria-labelledby='t d'><title id='t'>Engine and benchmark pipeline</title><desc id='d'>Block diagram of the scoring engine and the behaviour harness.</desc><rect width='760' height='440' fill='white'/><text x='20.0' y='28.0' font-size='16' text-anchor='start' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Engine and benchmark pipeline</text><text x='20.0' y='48.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Left: the scoring engine under test (SIMULATION). Right: the behaviour harness (MEASURED).</text><text x='20.0' y='84.0' font-size='13' text-anchor='start' fill='#c05621' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Study S: scoring engine</text><rect x='20.0' y='96.0' width='120.0' height='52.0' rx='4' fill='#f7fafc' stroke='#c05621'/><text x='80.0' y='118.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>inputs</text><text x='80.0' y='136.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>drift, halluc, anchor</text><rect x='190.0' y='96.0' width='120.0' height='52.0' rx='4' fill='#f7fafc' stroke='#c05621'/><text x='250.0' y='118.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>T, S, A</text><text x='250.0' y='136.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>truth, Fibonacci, anchor</text><rect x='360.0' y='96.0' width='120.0' height='52.0' rx='4' fill='#f7fafc' stroke='#c05621'/><text x='420.0' y='118.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>V score</text><text x='420.0' y='136.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>weights 0.3/0.2/0.2/0.3</text><rect x='530.0' y='96.0' width='120.0' height='52.0' rx='4' fill='#f7fafc' stroke='#c05621'/><text x='590.0' y='118.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>prime gate</text><text x='590.0' y='136.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>hash mod p veto</text><rect x='530.0' y='180.0' width='120.0' height='52.0' rx='4' fill='#f7fafc' stroke='#c05621'/><text x='590.0' y='202.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>pass / block</text><text x='590.0' y='220.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>V &gt;= 0.65 and clear</text><line x1='140.0' y1='122.0' x2='190.0' y2='122.0' stroke='#c05621' stroke-width='1.5'/><polygon points='190,122 183,118 183,126' fill='#c05621'/><line x1='310.0' y1='122.0' x2='360.0' y2='122.0' stroke='#c05621' stroke-width='1.5'/><polygon points='360,122 353,118 353,126' fill='#c05621'/><line x1='480.0' y1='122.0' x2='530.0' y2='122.0' stroke='#c05621' stroke-width='1.5'/><polygon points='530,122 523,118 523,126' fill='#c05621'/><line x1='590.0' y1='148.0' x2='590.0' y2='180.0' stroke='#c05621' stroke-width='1.5'/><text x='20.0' y='268.0' font-size='13' text-anchor='start' fill='#2b6cb0' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Studies B and P: behaviour harness</text><rect x='20.0' y='280.0' width='130.0' height='52.0' rx='4' fill='#f7fafc' stroke='#2b6cb0'/><text x='85.0' y='302.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>680 statements</text><text x='85.0' y='320.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>true / false, seed 7</text><rect x='190.0' y='280.0' width='150.0' height='52.0' rx='4' fill='#f7fafc' stroke='#2b6cb0'/><text x='265.0' y='302.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>13 framings</text><text x='265.0' y='320.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>4 Study B + 9 pressure</text><rect x='380.0' y='280.0' width='130.0' height='52.0' rx='4' fill='#f7fafc' stroke='#2b6cb0'/><text x='445.0' y='302.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Ollama model</text><text x='445.0' y='320.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>1 token, T = 0</text><rect x='550.0' y='280.0' width='150.0' height='52.0' rx='4' fill='#f7fafc' stroke='#2b6cb0'/><text x='625.0' y='302.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>logprob(True) vs (False)</text><text x='625.0' y='320.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>answer + flip rate</text><line x1='150.0' y1='306.0' x2='190.0' y2='306.0' stroke='#2b6cb0' stroke-width='1.5'/><polygon points='190,306 183,302 183,310' fill='#2b6cb0'/><line x1='340.0' y1='306.0' x2='380.0' y2='306.0' stroke='#2b6cb0' stroke-width='1.5'/><polygon points='380,306 373,302 373,310' fill='#2b6cb0'/><line x1='510.0' y1='306.0' x2='550.0' y2='306.0' stroke='#2b6cb0' stroke-width='1.5'/><polygon points='550,306 543,302 543,310' fill='#2b6cb0'/><rect x='550.0' y='364.0' width='150.0' height='52.0' rx='4' fill='#f7fafc' stroke='#2b6cb0'/><text x='625.0' y='386.0' font-size='13' text-anchor='middle' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>bootstrap CI</text><text x='625.0' y='404.0' font-size='10' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>effect size, McNemar, Holm</text><line x1='625.0' y1='332.0' x2='625.0' y2='364.0' stroke='#2b6cb0' stroke-width='1.5'/><text x='20.0' y='392.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Raw trials stay off-repo; summaries go to results/.</text><text x='20.0' y='410.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>No hidden state is read. No feelings are measured.</text></svg>
