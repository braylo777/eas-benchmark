<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 310' width='760' height='310' role='img' aria-labelledby='t d'><title id='t'>Simulation versus measured</title><desc id='d'>False-pass of the scoring engine in simulation next to the measured model flip rate.</desc><rect width='760' height='310' fill='white'/><text x='20.0' y='28.0' font-size='16' text-anchor='start' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Simulation vs measured</text><text x='20.0' y='48.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Two different quantities on one axis. They are not comparable as accuracy. 95% CIs.</text><line x1='250.0' y1='92.0' x2='250.0' y2='240.0' stroke='#e2e8f0' stroke-width='1'/><text x='250.0' y='256.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>0%</text><line x1='367.5' y1='92.0' x2='367.5' y2='240.0' stroke='#e2e8f0' stroke-width='1'/><text x='367.5' y='256.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>25%</text><line x1='485.0' y1='92.0' x2='485.0' y2='240.0' stroke='#e2e8f0' stroke-width='1'/><text x='485.0' y='256.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>50%</text><line x1='602.5' y1='92.0' x2='602.5' y2='240.0' stroke='#e2e8f0' stroke-width='1'/><text x='602.5' y='256.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>75%</text><line x1='720.0' y1='92.0' x2='720.0' y2='240.0' stroke='#e2e8f0' stroke-width='1'/><text x='720.0' y='256.0' font-size='11' text-anchor='middle' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>100%</text><text x='238.0' y='133.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>SIMULATION: scoring engine false-pass</text><text x='238.0' y='149.0' font-size='11' text-anchor='end' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>at V &gt;= 0.65, assumed generators</text><rect x='250.0' y='124.0' width='263.1' height='22.0' rx='4' fill='#c0562155' stroke='#c05621'/><line x1='512.5' y1='135.0' x2='513.8' y2='135.0' stroke='#1a202c' stroke-width='2'/><text x='521.8' y='139.0' font-size='12' text-anchor='start' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>56%</text><text x='238.0' y='203.0' font-size='12' text-anchor='end' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>MEASURED: models flip to a wrong claim</text><text x='238.0' y='219.0' font-size='11' text-anchor='end' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>under pressure prompts, pooled</text><rect x='250.0' y='194.0' width='276.0' height='22.0' rx='4' fill='#2b6cb055' stroke='#2b6cb0'/><line x1='521.2' y1='205.0' x2='531.0' y2='205.0' stroke='#1a202c' stroke-width='2'/><text x='539.0' y='209.0' font-size='12' text-anchor='start' fill='#1a202c' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>59%</text><text x='20.0' y='290.0' font-size='11' text-anchor='start' fill='#718096' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>The simulation describes formulas under assumed inputs. The measured value describes named local models on one task.</text></svg>
