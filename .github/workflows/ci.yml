name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo llvm-cov --summary-only --ignore-filename-regex 'src/bin' --fail-under-lines 90
      - run: cargo run --release --bin montecarlo -- --n 5000 --seeds 3 --boot 200 --auc-boot 20 --out /tmp/mc.json
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy scikit-learn
      - run: python tests/test_engine.py
      - name: parity fixtures are up to date
        run: |
          python scripts/export_parity.py
          git diff --exit-code rust/tests/fixtures/
